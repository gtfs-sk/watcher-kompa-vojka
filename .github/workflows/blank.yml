# This is a basic workflow to help you get started with Actions

name: Watch Kompa Vojka Status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check service status
        id: status
        run: |
          RESULT=$(curl -s https://kompa-vojka.sk/api/public/service-status | jq -c '.[] | select(.inService | tostring | contains("true"))')
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ -n "$RESULT" ]; then
            echo "has_service=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_service=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification
        if: steps.status.outputs.has_service == 'true'
        run: |
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"<@398178387908100138> Kompa Vojka **Down** • https://kompa-vojka.sk/\"}"
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
